<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Casa Poke</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-formulario pagina-cadastro">
    <a class="marca marca-form" href="index.html">CASA <span>POKE</span></a>
    <form class="cartao-form cartao-cadastro">
        <p class="sobretitulo">NOVO CADASTRO</p>
        <h1>Criar sua conta</h1>
        <p class="descricao-form">Preencha seus dados para acessar o catálogo de Poke e Sushi.</p>

        <div class="grade-cadastro">
            <div>
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome">
            </div>
            <div>
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" placeholder="Seu sobrenome">
            </div>
            <div>
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>
            <div>
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(11) 99999-9999">
            </div>
            <div class="campo-completo">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com">
            </div>
            <div class="campo-completo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha">
            </div>
            <div class="campo-completo">
                <label for="rua">Rua e número</label>
                <input type="text" id="rua" placeholder="Ex: Rua das Flores, 123">
            </div>
            <div>
                <label for="cep">CEP</label>
                <input type="text" id="cep" placeholder="00000-000">
            </div>
            <div>
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Sua cidade">
            </div>
            <div class="campo-completo">
                <label for="estado">Estado (UF)</label>
                <input type="text" id="estado" placeholder="Ex: SP">
            </div>
        </div>

        <button class="botao botao-verde botao-largo" type="button" onclick="enviarDados()">Cadastrar</button>
        <p class="texto-apoio">Já possui cadastro? <a href="login.html">Fazer login</a></p>
        <a class="voltar" href="index.html">← Voltar ao início</a>
    </form>
    <script src="post.js"></script>
</body>
</html>
